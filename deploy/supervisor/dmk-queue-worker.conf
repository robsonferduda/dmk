; Worker da fila do DMK (Redis). Processa e-mails em fila e os webhooks da Autentique.
; Instalação: copiar para /etc/supervisor/conf.d/, ajustar o caminho do projeto se não for /var/www/html/dmk e rodar:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status
; Após cada deploy: php artisan queue:restart (o supervisor sobe o worker de novo com o código novo).
;
; --timeout precisa ser menor que retry_after da conexão redis em config/queue.php (90s).

[program:dmk-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/dmk/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=85 --delay=60
directory=/var/www/html/dmk
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/dmk/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=120
